version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: inventaris_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - inventaris_network
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: inventaris_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - inventaris_network
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: inventaris_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inventaris}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-riki190201}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - inventaris_network

  redis:
    image: redis:alpine
    container_name: inventaris_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - inventaris_network



networks:
  inventaris_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
